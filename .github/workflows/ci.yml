name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install desktop toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libice6 libsm6 libfontconfig1 libfreetype6

      - name: Restore
        run: dotnet restore LunarWard.slnx

      - name: Build
        run: dotnet build LunarWard.slnx -c Release --no-restore

      - name: Debug 构建门禁（覆盖 #if DEBUG 分支）
        # 只编 Release 会漏掉 #if DEBUG 里的编译错误（2026-10-25 就漏过一次 CS0103/CS0168）。
        run: dotnet build LunarWard.slnx -c Debug -warnaserror --no-restore

      - name: 警告门禁（全量重编，避免增量构建漏报）
        # 增量构建不会重编未改动项目，警告会被漏掉（审计 2026-10-25 误判 CA1416 的教训）。
        run: dotnet build LunarWard.slnx -c Release -t:Rebuild -warnaserror --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/LunarWard.UnitTests/LunarWard.UnitTests.csproj -c Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results

      - name: Installer unit tests
        run: >
          dotnet test tests/LunarWard.Installer.UnitTests/LunarWard.Installer.UnitTests.csproj -c Release --no-build
          --logger "trx;LogFileName=installer.trx" --results-directory artifacts/test-results

      # 审计 M-02：集成测试此前从不进 CI，启动链路（相位引擎/真机 wine 跳过逻辑）没有门禁。
      - name: Integration tests
        run: >
          dotnet test tests/LunarWard.IntegrationTests/LunarWard.IntegrationTests.csproj -c Release --no-build
          --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results

      - name: Skip budget
        run: python3 scripts/check-skips.py artifacts/test-results --max-skips 30

      - name: UI parity table sanity
        run: python3 scripts/check-parity.py
