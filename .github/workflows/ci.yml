name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install desktop toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libice6 libsm6 libfontconfig1 libfreetype6

      - name: Restore
        run: dotnet restore LunarWard.slnx

      - name: Build
        run: dotnet build LunarWard.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/LunarWard.UnitTests/LunarWard.UnitTests.csproj -c Release --no-build

      - name: Installer unit tests
        run: dotnet test tests/LunarWard.Installer.UnitTests/LunarWard.Installer.UnitTests.csproj -c Release --no-build

      - name: UI parity table sanity
        run: python3 scripts/check-parity.py
